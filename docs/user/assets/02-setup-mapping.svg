<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 650" role="img" aria-labelledby="title description">
  <title id="title">Map only course/</title>
  <desc id="description">Schematic: your repository contains three root records outside course; only course with its configuration, Home, navigation, includes and assets maps to the new restricted course Space. This is a schematic, not a screenshot.</desc>
