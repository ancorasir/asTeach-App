    <text x="100" y="261" font-size="24" font-weight="700" fill="#17372f">course/</text>
    <text x="100" y="291" font-size="21" fill="#314c45">Configuration · Home · navigation</text>
    <path d="M 340 320 v 10 m -5 -4 l 5 5 l 5 -5" fill="none" stroke="#52766b" stroke-width="2"/>
    <rect x="34" y="337" width="612" height="88" rx="12" fill="#ffffff" stroke="#9dafaa" stroke-width="1.5"/>
    <circle cx="66" cy="370" r="17" fill="#245e50"/>
    <text x="66" y="376" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">3</text>
